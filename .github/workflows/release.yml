# Builds the Windows installer on GitHub.
#   - push of a tag v* (e.g. v1.0.0): builds and creates a draft GitHub Release with the installer attached
#   - manual run (Actions tab > Release > Run workflow): builds only; the installer is a workflow artifact
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-2025 # has Visual Studio C++ + Windows 11 SDK, CMake, Inno Setup and gh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Build installer
        shell: pwsh
        run: |
          # on a tag, the build fails if the tag doesn't match simplevcam.__version__
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          ./packaging/build_release.ps1 -Python python -ExpectedVersion $tag

      - uses: actions/upload-artifact@v7
        with:
          name: simpleVCam-installer
          path: dist/*

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --draft \
            --title "simpleVCam ${{ github.ref_name }}" \
            --generate-notes
